<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Solex - Quotation Generator</title>
    <style>
        :root { --primary: #FF6B00; --dark: #1a1a2e; --green: #00C853; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #f8f9fa; color: #333; }
        
        /* Form Styling */
        #formPage { padding: 20px; max-width: 600px; margin: auto; background: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .gen-btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 20px; }

        /* Preview / Quotation Styling */
        #previewPage { display: none; background: white; max-width: 800px; margin: auto; min-height: 100vh; }
        
        .nav-buttons { background: var(--dark); padding: 15px; text-align: center; position: sticky; top: 0; }
        .btn-print { background: var(--green); color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 90%; margin-bottom: 10px; }
        .btn-back { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 10px; width: 90%; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .q-header { background: var(--primary); color: white; padding: 25px 20px; display: flex; align-items: center; border-bottom: 5px solid var(--dark); }
        .logo-circle { background: white; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 30px; flex-shrink: 0; }
        .comp-info h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }
        .comp-info p { margin: 3px 0; font-size: 13px; opacity: 0.9; line-height: 1.4; }
        .comp-link { color: white; text-decoration: none; font-weight: bold; }

        .q-content { padding: 20px; }
        .q-title-box { text-align: center; margin-bottom: 20px; }
        .q-title-box h2 { color: var(--primary); margin: 0; font-size: 28px; }
        .validity-tag { background: #FFF3E0; color: #E65100; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 10px; }

        .ref-date-bar { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; margin-bottom: 20px; font-size: 14px; }
        
        .client-info-grid { margin-bottom: 30px; }
        .qcil { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 2px; }
        .qciv { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #111; }

        .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .qspec { display: flex; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .qsico { font-size: 20px; margin-right: 10px; width: 30px; text-align: center; }
        .qsl { display: block; font-size: 11px; color: #777; }
        .qsv { font-weight: bold; font-size: 14px; }

        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .price-label { font-size: 15px; }
        .price-val { text-align: right; font-weight: bold; font-size: 16px; }
        .total-row { border-top: 2px solid #eee; }
        .actual-cost-row td { color: var(--green); font-size: 18px; padding-top: 15px; }
        
        #qRem { margin-top: 20px; padding: 15px; background: #fffde7; border-left: 4px solid #fbc02d; font-size: 14px; }
        .footer-con { margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px; font-size: 13px; }

        @media print {
            .nav-buttons { display: none; }
            body { background: white; }
            #previewPage { margin: 0; width: 100%; }
        }
    </style>
</head>
<body>

<!-- INPUT FORM PAGE -->
<div id="formPage">
    <h2 style="text-align:center; color:var(--primary)">Solar Quotation Maker</h2>
    
    <div class="form-group">
        <label>Client Name</label>
        <input type="text" id="cName" placeholder="Customer ka naam">
    </div>
    <div class="form-group">
        <label>Address</label>
        <input type="text" id="cAddr" placeholder="Street/Area">
    </div>
    <div class="form-group">
        <label>City</label>
        <input type="text" id="cCity" placeholder="City">
    </div>
    <div class="form-group">
        <label>System Size</label>
        <select id="sSize">
            <option value="3 KW">3 KW</option>
            <option value="5 KW">5 KW</option>
            <option value="10 KW">10 KW</option>
            <option value="Others">Others</option>
        </select>
        <input type="text" id="oSize" placeholder="Specify size if Others" style="margin-top:5px; display:none">
    </div>
    <div class="form-group">
        <label>Solar Panels</label>
        <input type="text" id="sPanel" value="Mono PERC Half Cut">
    </div>
    <div class="form-group">
        <label>Inverter</label>
        <input type="text" id="sInv" value="On-Grid String Inverter">
    </div>
    <div class="form-group">
        <label>Structure Type</label>
        <input type="text" id="sStruct" value="GI High Raised Structure">
    </div>
    <div class="form-group">
        <label>Plant Type</label>
        <select id="sPlant">
            <option value="On-Grid">On-Grid</option>
            <option value="Off-Grid">Off-Grid</option>
            <option value="Hybrid">Hybrid</option>
        </select>
    </div>
    <div class="form-group">
        <label>System Price (Full)</label>
        <input type="number" id="sPrice" placeholder="Total Price (e.g. 200000)">
    </div>
    <div class="form-group">
        <label>Govt. Subsidy (Amount)</label>
        <input type="number" id="sSub" placeholder="Subsidy if any (e.g. 78000)">
    </div>
    <div class="form-group">
        <label>Consultant Name</label>
        <input type="text" id="conName" value="Solar Solex Team">
    </div>
    
    <!-- Hidden / Optional Fields to avoid errors in script -->
    <input type="hidden" id="cState" value="Maharashtra">
    <input type="hidden" id="cMob" placeholder="Mobile Number">
    <input type="hidden" id="qDate" value="">
    <input type="hidden" id="conPhone" value="7304894029">
    <textarea id="sRem" style="display:none" placeholder="Extra remarks..."></textarea>

    <button class="gen-btn" onclick="generate()">Generate Quotation</button>
</div>

<!-- PREVIEW PAGE -->
<div id="previewPage">
    <div class="nav-buttons">
        <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
        <button class="btn-back" onclick="back()">Back / Edit Info</button>
    </div>

    <div class="q-header">
        <div class="logo-circle">☀️</div>
        <div class="comp-info">
            <h1>SOLAR SOLEX</h1>
            <p>Om Sairam Enterprises</p>
            <p>338/2 Kirmiti (Bharkas), Hingna, Nagpur - 441122</p>
            <p>7304894029 | 9767473383</p>
            <p><a href="https://solarsolex.com" class="comp-link">SolarSolex.com</a> | GST: 27HFIPS6155A1Z8</p>
        </div>
    </div>

    <div class="q-content">
        <div class="q-title-box">
            <h2>Solar Quotation</h2>
            <p style="margin:5px 0; color:#666">On-Grid Solar Power Plant Proposal</p>
            <span class="validity-tag">Valid for 7 days from date of issue</span>
        </div>

        <div class="ref-date-bar">
            <span>Ref. No.: <b id="qRef">---</b></span>
            <span>Date: <b id="qDate2">---</b></span>
        </div>

        <div id="qClient" class="client-info-grid">
            <!-- Dynamic Client Info -->
        </div>

        <div id="qSpecs" class="specs-grid">
            <!-- Dynamic Specs -->
        </div>

        <table>
            <tbody id="qPriceBody">
                <!-- Dynamic Price Rows -->
            </tbody>
        </table>

        <div id="qRem" style="display:none">
            <b>Note:</b> <span id="qRemTxt"></span>
        </div>

        <div class="footer-con" id="qCon">
            <div id="qConData"></div>
        </div>
    </div>
</div>

<script>
// Show/Hide "Others" input
document.getElementById('sSize').addEventListener('change', function() {
    document.getElementById('oSize').style.display = this.value === 'Others' ? 'block' : 'none';
});

function fmt(num) {
    return '₹ ' + parseFloat(num).toLocaleString('en-IN');
}

function getRef() {
    var d = new Date();
    return "OSE/" + d.getFullYear() + "-" + (d.getFullYear()+1).toString().slice(-2) + "/" + Math.floor(1000 + Math.random() * 9000);
}

function generate() {
    var name = document.getElementById('cName').value.trim();
    var addr = document.getElementById('cAddr').value.trim();
    var city = document.getElementById('cCity').value.trim();
    var sv = document.getElementById('sSize').value;
    var panel = document.getElementById('sPanel').value;
    var iv = document.getElementById('sInv').value;
    var str = document.getElementById('sStruct').value;
    var tot = parseFloat(document.getElementById('sPrice').value) || 0;
    var con = document.getElementById('conName').value.trim();

    if(!name || !addr || !tot) { alert('Please fill Name, Address and Price!'); return; }

    var size = (sv === 'Others') ? document.getElementById('oSize').value : sv;
    var plant = document.getElementById('sPlant').value;
    var sub = parseFloat(document.getElementById('sSub').value) || 0;
    var rem = document.getElementById('sRem').value.trim();
    var mob = document.getElementById('cMob').value;
    var dt = new Date().toLocaleDateString('en-IN');

    document.getElementById('qRef').textContent = getRef();
    document.getElementById('qDate2').textContent = dt;
    document.title = name + ' - Solar Solex';

    // Client Info
    var cl = '<div class="qcil">Client Name</div><div class="qciv">'+name+'</div>';
    cl += '<div class="qcil">Address</div><div class="qciv">'+addr+', '+city+'</div>';
    if(mob) cl += '<div class="qcil">Mobile</div><div class="qciv">'+mob+'</div>';
    document.getElementById('qClient').innerHTML = cl;

    // Specs
    var sp = `
        <div class="qspec"><div class="qsico">⚡</div><div><span class="qsl">Size</span><span class="qsv">${size}</span></div></div>
        <div class="qspec"><div class="qsico">☀️</div><div><span class="qsl">Panels</span><span class="qsv">${panel}</span></div></div>
        <div class="qspec"><div class="qsico">🔄</div><div><span class="qsl">Inverter</span><span class="qsv">${iv}</span></div></div>
        <div class="qspec"><div class="qsico">🏗️</div><div><span class="qsl">Structure</span><span class="qsv">${str}</span></div></div>
    `;
    document.getElementById('qSpecs').innerHTML = sp;

    // Pricing
    var rows = `
        <tr><td class="price-label">System Price (${plant}) GST Included</td><td class="price-val">${fmt(tot)}</td></tr>
        <tr class="total-row"><td><b>Total Amount</b></td><td class="price-val">${fmt(tot)}</td></tr>
    `;
    if(sub > 0) {
        rows += `
            <tr><td style="color:#888">Less: Govt. Subsidy</td><td class="price-val" style="color:#FF6B00">- ${fmt(sub)}</td></tr>
            <tr class="actual-cost-row"><td><b>Your Actual Cost (After Subsidy)</b></td><td class="price-val"><b>${fmt(tot - sub)}</b></td></tr>
        `;
    }
    document.getElementById('qPriceBody').innerHTML = rows;

    // Remarks
    if(rem) {
        document.getElementById('qRem').style.display = 'block';
        document.getElementById('qRemTxt').textContent = rem;
    }

    document.getElementById('qConData').innerHTML = '<b>Consultant:</b> ' + con + ' | <b>Contact:</b> 7304894029';
    
    // Switch View
    document.getElementById('formPage').style.display = 'none';
    document.getElementById('previewPage').style.display = 'block';
    window.scrollTo(0,0);
}

function back() {
    document.getElementById('previewPage').style.display = 'none';
    document.getElementById('formPage').style.display = 'block';
}
</script>
</body>
</html>
